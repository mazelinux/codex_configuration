[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-history-analyzer"
version = "0.1.0"
description = "Read-only workflow analytics for Codex session traces"
requires-python = ">=3.10"

[project.scripts]
codex-history-analyzer = "codex_history_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
